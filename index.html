
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت شخصی من</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <div>
      <h1>مدیریت شخصی</h1>
      <p>مرکز کنترل مالی و عادت‌های روزانه</p>
    </div>
    <div class="date" id="today"></div>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>داشبورد اصلی</h2>
      <p>ماژول مورد نظرت رو انتخاب کن.</p>
    </section>

    <section class="modules">

      <button class="module-card" onclick="openModule('budget')">
        <span class="module-icon">💰</span>
        <h3>مدیریت بودجه</h3>
        <p>حساب‌ها، درآمد، هزینه و موجودی</p>
      </button>

      <button class="module-card" onclick="openModule('smoking')">
        <span class="module-icon">🚬</span>
        <h3>مدیریت سیگار</h3>
        <p>مصرف روزانه و هزینه سیگار</p>
      </button>

      <button class="module-card" onclick="openModule('savings')">
        <span class="module-icon">🐷</span>
        <h3>مدیریت پس‌انداز</h3>
        <p>هدف‌گذاری و پیگیری پس‌انداز</p>
      </button>

      <button class="module-card" onclick="openModule('currency')">
        <span class="module-icon">💵</span>
        <h3>تبدیل ارز</h3>
        <p>تبدیل دلار با نرخ دلخواه</p>
      </button>

      <button class="module-card" onclick="openModule('reports')">
        <span class="module-icon">📊</span>
        <h3>گزارش و آمار</h3>
        <p>نمودارها و بررسی عملکرد</p>
      </button>

    </section>

    <section class="total-dashboard">
      <h2>📈 جمع‌بندی کل</h2>
      <div class="total-grid">
        <div class="total-item">
          <span>مجموع درآمد</span>
          <strong id="totalIncome">۰ تومان</strong>
        </div>
        <div class="total-item">
          <span>مجموع هزینه</span>
          <strong id="totalExpense">۰ تومان</strong>
        </div>
        <div class="total-item">
          <span>موجودی نهایی</span>
          <strong id="totalBalance">۰ تومان</strong>
        </div>
      </div>
    </section>

    <section id="moduleContent" class="module-content" hidden>
      <button class="back-button" onclick="closeModule()">← بازگشت</button>
      <div id="moduleBody"></div>
    </section>

  </main>

  <footer>
    اطلاعات این برنامه روی همین مرورگر ذخیره می‌شود.
  </footer>

  <script src="app.js"></script>
</body>
</html>
